<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hán Tự Bay ✨ Flashcard Tiếng Trung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🐉 Hán Tự Bay — Flashcard Tiếng Trung</h1>
    <p>Học tiếng Trung dễ như chơi 💫</p>
  </header>

  <main>
    <div class="flashcard">
      <div id="hanzi" class="hanzi">你</div>
      <div id="pinyin" class="pinyin">nǐ</div>
      <div id="meaning" class="meaning">bạn, cậu</div>
      <div id="story" class="story">👋 Khi chào ai đó, bạn nói "nǐ hǎo" — Xin chào!</div>
      <div id="example" class="example">例句: 你好！<br>👉 Nǐ hǎo! (Xin chào!)</div>
    </div>

    <div class="buttons">
      <button id="prevBtn">⬅️ Trước</button>
      <button id="speakBtn">🔊 Phát âm</button>
      <button id="nextBtn">➡️ Tiếp</button>
    </div>

    <section class="ai-section">
      <h2>🤖 Hội thoại tự động</h2>
      <button id="generateBtn">Tạo đoạn hội thoại</button>
      <div id="dialogue"></div>
    </section>
  </main>

  <footer>
    <p>🌸 Designed for Gen Z learners by AI ✨</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
