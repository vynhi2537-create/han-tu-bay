<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Tiếng Trung Gen Z 🚀</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen p-4 flex flex-col items-center">
  <header class="text-center mb-6">
    <h1 class="text-3xl font-extrabold text-gray-800">Học Từ Mới Gen Z ✨</h1>
    <p class="text-sm text-gray-500">Tiếng Trung: Học Vui, Nhớ Lâu!</p>
  </header>

  <!-- Flashcard -->
  <div class="flashcard-container" onclick="flipCard()">
    <div id="cardInner" class="card-inner">
      <div class="card-face card-front">
        <div class="hanzi" id="displayHanzi">你好</div>
        <div class="pinyin" id="displayPinyin">nǐ hǎo</div>
      </div>
      <div class="card-face card-back">
        <div class="vietnamese" id="displayVietnamese">Xin chào</div>
        <div class="mnemonic" id="displayMnemonic">Gặp bạn thì phải tốt với nhau</div>
      </div>
    </div>
  </div>

  <!-- Điều khiển -->
  <div class="flex space-x-4 mt-6">
    <button class="btn btn-secondary" onclick="speakText()">🔊 Phát âm</button>
    <button class="btn btn-primary" onclick="nextCard()">⏭️ Tiếp theo</button>
  </div>

  <!-- AI hội thoại -->
  <div class="mt-10 w-full max-w-lg">
    <h2 class="text-xl font-bold mb-3">🤖 AI Luyện Hội Thoại</h2>
    <button class="btn btn-primary w-full mb-4" onclick="generateAndDisplayConversation()">Tạo Hội Thoại Mới</button>
    <div id="conversationDisplay" class="conversation-box hidden"></div>
    <div id="practiceArea" class="hidden mt-4">
      <h3 class="font-semibold mb-2">Luyện tập: Dịch câu cuối</h3>
      <p id="practiceVietnamese" class="mb-2 italic text-gray-600"></p>
      <input type="text" id="practiceInput" class="w-full p-3 border rounded-lg mb-3" placeholder="Gõ Pinyin" />
      <button class="btn btn-secondary w-full" onclick="checkPractice()">✅ Kiểm tra</button>
      <p id="practiceFeedback" class="mt-2 font-medium"></p>
    </div>
  </div>

  <!-- Phần thưởng -->
  <div id="rewardModal" class="reward-modal" onclick="hideReward()">
    <div class="reward-box">
      <div id="rewardEmoji" class="reward-emoji">🎉</div>
      <p class="text-2xl font-extrabold mt-4 text-green-600">Tuyệt vời! Hoàn thành xuất sắc!</p>
      <p class="text-sm text-gray-500 mt-2">Hãy tiếp tục học nhé!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
