<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HánTừBay — Flashcard tiếng Trung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🪶 HánTừBay</h1>
    <div class="header-right">
      <button id="importBtn">Nhập JSON</button>
      <button id="exportBtn">Xuất JSON</button>
      <button id="clearBtn">Xóa bộ từ</button>
    </div>
  </header>

  <main class="container">
    <section class="left">
      <form id="addForm" class="card">
        <h3>Thêm / sửa từ</h3>
        <input id="han" placeholder="汉字 (Hán tự)" required />
        <input id="pinyin" placeholder="Pinyin (có dấu)" required />
        <input id="vn" placeholder="Nghĩa (Tiếng Việt)" />
        <input id="radical" placeholder="Bộ thủ / cấu tạo" />
        <textarea id="story" placeholder="Cách nhớ (1-2 câu)"></textarea>
        <input id="example" placeholder="Ví dụ (Hán tự)" />
        <input id="examplePinyin" placeholder="Pinyin của ví dụ" />
        <input id="exampleVN" placeholder="Dịch ví dụ (VN)" />
        <input id="animFile" placeholder="Tên file animation (ví dụ: ni.mp4) — đặt trong /animations/" />
        <input id="emoji" placeholder="Emoji (ví dụ: 🎉)" />
        <div class="row">
          <button type="submit">Thêm / Lưu</button>
          <button type="button" id="randomFill">Mẫu nhanh</button>
        </div>
      </form>

      <div class="card vocab-list" id="vocabList">
        <h4>Kho từ</h4>
        <div id="listInner"></div>
      </div>
    </section>

    <section class="right">
      <div class="card viewer" id="viewer">
        <div class="flashcard" id="flashcard">
          <div class="face front" id="frontFace">
            <div class="han" id="viewHan">学</div>
            <div class="pinyin" id="viewPinyin">xué</div>
          </div>
          <div class="face back" id="backFace">
            <div class="meaning" id="viewVN">Học</div>
            <div class="storySmall" id="viewStory">Cách nhớ...</div>
          </div>
        </div>

        <div class="controls">
          <button id="prev">◀</button>
          <button id="flip">🔁 Lật thẻ</button>
          <button id="playWord">🔊 Phát từ</button>
          <button id="next">▶</button>
        </div>

        <div class="exampleBox card" id="exampleBox">
          <strong>Ví dụ:</strong>
          <div id="viewExample"></div>
          <div class="exampleMeta">
            <span id="viewExamplePinyin"></span> — <span id="viewExampleVN"></span>
            <button id="playExample">🔊 Phát câu</button>
          </div>
        </div>

        <div class="ai-controls card">
          <select id="topicSelect">
            <option value="random">Ngẫu nhiên</option>
            <option value="greeting">Chào hỏi</option>
            <option value="study">Học tập</option>
            <option value="food">Ăn uống</option>
            <option value="daily">Hằng ngày</option>
          </select>
          <button id="generateDialogue">Tạo hội thoại (AI)</button>
          <button id="regenDialogue">Tạo lại (AI)</button>
        </div>

        <div class="card dialogue" id="dialogueArea">(Đoạn hội thoại sẽ xuất hiện ở đây)</div>

        <div class="card exercise" id="exerciseArea"></div>

        <div class="card reward" id="rewardArea" style="display:none">
          <video id="rewardVideo" width="300" autoplay muted playsinline></video>
          <div id="rewardEmoji" class="bigEmoji" style="display:none"></div>
        </div>
      </div>
    </section>
  </main>

  <input type="file" id="importFile" accept="application/json" style="display:none" />

  <footer>
    <small>Chạy offline; để sử dụng OpenAI thật, triển khai server theo hướng dẫn trong README (mẫu server kèm theo).</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
