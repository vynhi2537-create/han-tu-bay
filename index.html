<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen Z Chinese Flashcards</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-r from-pink-200 via-purple-200 to-blue-200 min-h-screen flex flex-col items-center justify-center p-6">

  <h1 class="text-3xl font-bold text-purple-700 mb-4">🌸 Gen Z Chinese Flashcards 🌸</h1>

  <div id="flashcard" class="flashcard" onclick="flipCard()">
    <div class="front flex items-center justify-center">
      <div>
        <h2 id="hanzi" class="text-6xl font-bold text-gray-800"></h2>
        <p id="pinyin" class="text-xl text-gray-600 mt-2"></p>
      </div>
    </div>
    <div class="back flex flex-col justify-center items-center text-center p-4">
      <h3 id="meaning" class="text-2xl text-gray-700"></h3>
      <p id="mnemonic" class="text-gray-600 mt-2 italic"></p>
      <button onclick="speakWord()" class="speak-btn mt-4 bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-xl">🔊 Nghe phát âm</button>
    </div>
  </div>

  <div id="emoji" class="emoji hidden">🎉</div>

  <div class="flex gap-4 mt-6">
    <button onclick="prevCard()" class="control-btn bg-pink-400 hover:bg-pink-500 text-white px-4 py-2 rounded-xl">⬅ Trước</button>
    <button onclick="nextCard()" class="control-btn bg-blue-400 hover:bg-blue-500 text-white px-4 py-2 rounded-xl">➡ Tiếp</button>
  </div>

  <div class="mt-10 text-center">
    <button onclick="generateDialogue()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl">🤖 Tạo hội thoại bằng AI</button>
    <div id="dialogue" class="dialogue mt-4 p-4 bg-white rounded-2xl shadow-lg text-gray-700"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
